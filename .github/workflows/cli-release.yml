name: CLI Release

on:
  push:
    tags:
      - "cli/*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag version
        id: version
        working-directory: cli
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#cli/}"
          TAG_VERSION_PREFIX="${TAG_VERSION%%[^0-9.]*}"
          CARGO_VERSION="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"])')"

          if [[ -z "$CARGO_VERSION" ]]; then
            echo "Could not find package version in cli/Cargo.toml"
            exit 1
          fi

          if [[ "$TAG_VERSION_PREFIX" != "$CARGO_VERSION" ]]; then
            echo "Tag version prefix $TAG_VERSION_PREFIX must match cli/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

          if [[ "$TAG_VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  test:
    name: Test CLI
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: cli
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs:
      - validate
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            builder: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build
        working-directory: cli
        run: |
          "${{ matrix.builder }}" build --release --locked --target "${{ matrix.target }}"

      - name: Package artifact
        working-directory: cli
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ASSET_NAME="cuet-${VERSION}-${TARGET}"
          mkdir -p "dist/${ASSET_NAME}"
          cp "target/${TARGET}/release/cuet" "dist/${ASSET_NAME}/cuet"
          cp ../LICENSE "dist/${ASSET_NAME}/LICENSE"
          tar -C dist -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          shasum -a 256 "dist/${ASSET_NAME}.tar.gz" > "dist/${ASSET_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuet-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: cuet CLI ${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.sha256

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - validate
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tap token
        id: tap-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 4013001
          private-key: ${{ secrets.TAP_RELEASE_GITHUB_APP_SECRET }}
          owner: medulla-sh
          repositories: homebrew-tap

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: medulla-sh/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Update formula
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/render-homebrew-formula.py

      - name: Push tap update
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/cuet.rb; then
            echo "Formula is already up to date"
            exit 0
          fi

          git config user.name "cuet-release[bot]"
          git config user.email "cuet-release[bot]@users.noreply.github.com"
          git add Formula/cuet.rb
          git commit -m "Update cuet formula to ${{ needs.validate.outputs.version }}"
          git push origin HEAD:main
