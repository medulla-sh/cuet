name: Module CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: mod
jobs:
  check:
    name: Check module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.17.0
      - name: Check formatting
        run: cue fmt --check ./...
      - name: Validate
        run: cue vet ./...
      - name: Test primitives
        run: cue vet -t test ./...
      - name: Validate framework behavior
        working-directory: tests/framework
        run: cue vet ./...
      - name: Check module dependencies
        run: cue mod tidy --check
