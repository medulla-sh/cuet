name: Module Release
on:
  push:
    tags:
      - "mod/*"
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    name: Publish CUE module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.17.1
      - name: Generate Buildkite pipeline schema
        working-directory: mod
        run: ../scripts/generate-buildkite-schema.sh
      - name: Tidy module
        working-directory: mod
        run: cue mod tidy
      - name: Publish module
        working-directory: mod
        run: |
          VERSION="${GITHUB_REF_NAME#mod/}"
          cue login --token "${{ secrets.CUE_REGISTRY_TOKEN }}"
          cue mod publish "v$VERSION"
