[package]
name = "cuet"
version = "0.9.2"
edition = "2024"
description = "A CLI for managing infrastructure deployment using the cuet framework."
license = "MIT"
repository = "https://github.com/medulla-sh/cuet"
homepage = "https://github.com/medulla-sh/cuet"
readme = "README.md"
keywords = ["cue", "terraform", "infrastructure", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cuet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "unicode", "wrap_help"] }
# 4.6.7's dynamic feature depends on an unavailable shlex 2.x release.
clap_complete = { version = "=4.6.6", features = ["unstable-dynamic"] }
humantime = "2.4.0"
inquire = "0.9.4"
libc = "0.2.178"
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.1"
which = "8.0.0"
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.23.0"

[lints.clippy]
all = "warn"
pedantic = "warn"
